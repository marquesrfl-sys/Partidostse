<script id='wm-13-script'>
(function(){
  const partidos = [
    {sigla: 'MDB', cls: 'wm-mdb', ideologia: 'Centrinso, fisiologismo'},
    {sigla: 'PDT', cls: 'wm-pdt', ideologia: 'Trabalhismo'},
    {sigla: 'PSB', cls: 'wm-psb', ideologia: 'Socialismo democrático'},
    {sigla: 'PCdoB', cls: 'wm-pcdob', ideologia: 'Comunismo'},
    {sigla: 'PSDB', cls: 'wm-psdb', ideologia: 'Social-democracia'},
    {sigla: 'AGIR', cls: 'wm-agir', ideologia: 'Conservadorismo cristão'},
    {sigla: 'PSTU', cls: 'wm-pstu', ideologia: 'PSTU'},
    {sigla: 'PCB', cls: 'wm-pcb', ideologia: 'Comunismo histórico'},
    {sigla: 'PCO', cls: 'wm-pco', ideologia: 'PCO'},
    {sigla: 'PODE', cls: 'wm-pode', ideologia: 'Centrismo reformista'},
    {sigla: 'PL', cls: 'wm-pl', ideologia: 'Bolsonarismo'},
    {sigla: 'PT', cls: 'wm-pt', ideologia: 'Petismo'},
    {sigla: 'PRTB', cls: 'wm-prtb', ideologia: 'Conservadorismo, nacionalismo'},
    {sigla: 'DC', cls: 'wm-dc', ideologia: 'Democracia cristã'},
    {sigla: 'PSD', cls: 'wm-psd', ideologia: 'Centro, social-democracia'},
    {sigla: 'PSOL', cls: 'wm-psol', ideologia: 'Socialismo, esquerda'},
    {sigla: 'REPUBLICANOS', cls: 'wm-republicanos', ideologia: 'Conservadorismo, democracia cristã'},
    {sigla: 'PP', cls: 'wm-pp', ideologia: 'Conservadorismo, centro-direita'},
    {sigla: 'CIDADANIA', cls: 'wm-cidadania', ideologia: 'Centro, social-democracia'},
    {sigla: 'PV', cls: 'wm-pv', ideologia: 'Ecologismo, centro-esquerda'},
    {sigla: 'AVANTE', cls: 'wm-avante', ideologia: 'Centro, centrismo'},
    {sigla: 'SOLIDARIEDADE', cls: 'wm-solidariedade', ideologia: 'Centro, trabalhismo'},
    {sigla: 'NOVO', cls: 'wm-novo', ideologia: 'Liberalismo, direita'},
    {sigla: 'REDE', cls: 'wm-rede', ideologia: 'Ecologismo, sustentabilidade'},
    {sigla: 'MOBILIZA', cls: 'wm-mobiliza', ideologia: 'Centro, social-democracia'},
    {sigla: 'PRD', cls: 'wm-prd', ideologia: 'Centro-direita, liberal-conservadorismo'},
    {sigla: 'UP', cls: 'wm-up', ideologia: 'Esquerda radical, socialismo'},
    {sigla: 'DEMOCRATA', cls: 'wm-democrata', ideologia: 'Centro, direitos das mulheres'},
    {sigla: 'PMB', cls: 'wm-democrata', ideologia: 'Centro, direitos das mulheres'},
    {sigla: 'UNIÃO', cls: 'wm-uniao', ideologia: 'Centro-direita, liberal-conservadorismo'},
    {sigla: 'UNIÃO BRASIL', cls: 'wm-uniao', ideologia: 'Centro-direita, liberal-conservadorismo'},
    {sigla: 'UB', cls: 'wm-uniao', ideologia: 'Centro-direita, liberal-conservadorismo'},
    {sigla: 'UNIAO', cls: 'wm-uniao', ideologia: 'Centro-direita, liberal-conservadorismo'},
    {sigla: 'UNIAO BRASIL', cls: 'wm-uniao', ideologia: 'Centro-direita, liberal-conservadorismo'},
    {sigla: 'MISSÃO', cls: 'wm-missao', ideologia: 'Direita jovem MBL'},
    {sigla: 'MISSAO', cls: 'wm-missao', ideologia: 'Direita jovem MBL'},
  ];
  
  function getCard(el){
    let cur = el;
    for(let i=0;i<8;i++){
      if(!cur) return null;
      const cls = cur.className || '';
      if(typeof cls === 'string' && cls.includes('rounded-') && cur.offsetWidth > 220 && cur.offsetHeight > 100){
        return cur;
      }
      cur = cur.parentElement;
    }
    return el.closest('div[class*="rounded"]');
  }
  
  function applyAll(){
    let counts = {};
    document.querySelectorAll('*').forEach(el => {
      if(!el.children || el.children.length !== 0) return;
      const txt = (el.textContent || '').trim();
      partidos.forEach(p => {
        if(txt === p.sigla){
          const card = getCard(el);
          if(card && !card.classList.contains(p.cls)){
            const depCount = (card.textContent.match(/deputados/gi) || []).length;
            if(depCount > 3) return; // EXCLUI GRÁFICO
            if(card.textContent.includes('DEPUTADOS') || card.textContent.includes('SENADORES') || card.textContent.includes(p.sigla)){
              card.classList.add(p.cls);
              counts[p.sigla] = (counts[p.sigla]||0)+1;
            }
          }
        }
      });
    });
    
    // Remove marca d'água do gráfico se já tiver sido aplicada
    document.querySelectorAll('.wm-uniao, .wm-democrata, .wm-missao, .wm-pmb, .wm-ub, .wm-uniao-brasil').forEach(el => {
      const depCount = (el.textContent.match(/deputados/gi) || []).length;
      if(depCount > 3){
        el.classList.remove('wm-uniao','wm-democrata','wm-missao','wm-pmb','wm-ub','wm-uniao-brasil');
      }
    });

    if(Object.keys(counts).length>0) console.log('WM aplicados:', counts);
  }
  
  function init(){
    applyAll();
    [600,1500,3000,5000].forEach(ms => setTimeout(applyAll, ms));
  }
  
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  new MutationObserver(applyAll).observe(document.body, {childList:true, subtree:true});
})();
</script>
